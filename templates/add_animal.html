{% extends "base.html" %}

{% block title %}Add New Stuffy{% endblock %}

{% block content %}
<section class="hero">
    <h1 class="hero-title">Add a New Friend</h1>
    <p class="hero-subtitle">New stuffies start in the catalogue. Train the model later to make them detectable.</p>
</section>

<div class="panel panel-centered">
    <form method="POST" action="/add" class="form-grid">
        <div>
            <label for="name">Name</label>
            <input type="text" id="name" name="name" placeholder="Cherry" required>
        </div>

        <div>
            <label for="species">Species</label>
            <input type="text" id="species" name="species" placeholder="Cow" required>
        </div>

        <div>
            <label for="colours">Colours</label>
            <input type="text" id="colours" name="colours" placeholder="Pink, White">
        </div>

        <div>
            <label for="acquired">Date Acquired</label>
            <input type="month" id="acquired" name="acquired">
        </div>

        <div>
            <label for="size">Size</label>
            <select id="size" name="size">
                <option value="Small">Small</option>
                <option value="Medium">Medium</option>
                <option value="Large">Large</option>
            </select>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Save to Catalogue</button>
            <a href="/" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
